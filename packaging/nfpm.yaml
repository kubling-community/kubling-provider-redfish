name: kubling-redfish-provider
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
version_schema: semver
release: "1"
section: admin
priority: optional
maintainer: Kubling contributors <kubling-community@users.noreply.github.com>
description: Read-only multi-device Redfish provider for Kubling
homepage: https://github.com/kubling-community/kubling-provider-redfish
license: Apache-2.0

contents:
  - src: build/kubling-redfish-provider
    dst: /usr/bin/kubling-redfish-provider
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/kubling-redfish-provider/README.md
    file_info:
      mode: 0644
  - src: config.example.yaml
    dst: /etc/kubling/redfish-provider.yaml.example
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/kubling-redfish-provider/copyright
    file_info:
      mode: 0644

deb:
  compression: xz
  fields:
    Bugs: https://github.com/kubling-community/kubling-provider-redfish/issues
