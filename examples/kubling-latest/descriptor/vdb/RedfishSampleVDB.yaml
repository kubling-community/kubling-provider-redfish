---
name: "RedfishSampleVDB"
version: "1"

dataSources:
  - name: "redfish"
    description: "Deterministic virtual Redfish fleet served by the local Kubling Redfish provider."
    dataSourceType: "PROVIDER_GRPC"
    configObject:
      address: "{{ PROVIDER_HOST }}"
      port: {{ PROVIDER_PORT }}
      securityConfig:
        mode: "PLAINTEXT"
      cache:
        enabled: false
      contributesToHealth: true
    schema:
      type: "PHYSICAL"
      cacheDefaultStrategy: "NO_CACHE"

rbacDataRoles: []
