name: kubling-redfish-latest

services:
  descriptor-builder:
    image: docker.io/kubling/kubling-cli:latest
    pull_policy: always
    command:
      - bundle
      - genmod
      - /descriptor
      - --output
      - /bundle/redfish-sample-descriptor.zip
      - --parse
    volumes:
      - ./descriptor:/descriptor:ro
      - descriptor-bundle:/bundle

  bmc-a:
    build:
      context: ../..
      dockerfile: test/container/Dockerfile
      target: mock
    environment:
      REDFISH_MOCK_ID: bmc-a
      REDFISH_MOCK_USERNAME: operator
      REDFISH_MOCK_PASSWORD: synthetic-password
      REDFISH_MOCK_POWER_WATTS: "248.5"
      REDFISH_MOCK_TEMPERATURE_CELSIUS: "27.25"
      REDFISH_MOCK_HUMIDITY_PERCENT: "41"
      REDFISH_MOCK_FAN_RPM: "4800"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  bmc-b:
    build:
      context: ../..
      dockerfile: test/container/Dockerfile
      target: mock
    environment:
      REDFISH_MOCK_ID: bmc-b
      REDFISH_MOCK_USERNAME: operator
      REDFISH_MOCK_PASSWORD: synthetic-password
      REDFISH_MOCK_POWER_WATTS: "312.75"
      REDFISH_MOCK_TEMPERATURE_CELSIUS: "31.5"
      REDFISH_MOCK_HUMIDITY_PERCENT: "46.5"
      REDFISH_MOCK_FAN_RPM: "5600"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  provider:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      - bmc-a
      - bmc-b
    environment:
      REDFISH_SAMPLE_USERNAME: operator
      REDFISH_SAMPLE_PASSWORD: synthetic-password
    expose:
      - "50051"
    volumes:
      - ./provider.yaml:/etc/kubling/provider.yaml:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  provider-readiness:
    image: docker.io/fullstorydev/grpcurl:latest
    pull_policy: always
    command:
      - -plaintext
      - -d
      - "{}"
      - provider:50051
      - kubling.provider.v1.ProviderService/Health
    depends_on:
      provider:
        condition: service_started
    restart: "on-failure:30"

  kubling:
    image: ${KUBLING_IMAGE:-docker.io/kubling/kubling:latest}
    pull_policy: always
    environment:
      APP_CONFIG: /sample/app-config.yaml
      DESCRIPTOR_BUNDLE: /sample/bundle/redfish-sample-descriptor.zip
      ENABLE_WEB_CONSOLE: "true"
      MAIN_HTTP_PORT: "8282"
      PROVIDER_HOST: provider
      PROVIDER_PORT: "50051"
    depends_on:
      descriptor-builder:
        condition: service_completed_successfully
      provider-readiness:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KUBLING_HTTP_PORT:-8282}:8282"
    volumes:
      - ./app-config.yaml:/sample/app-config.yaml:ro
      - descriptor-bundle:/sample/bundle:ro

  stack-readiness:
    image: docker.io/curlimages/curl:latest
    pull_policy: always
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      kubling:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://kubling:8282/observe/health
      interval: 2s
      timeout: 5s
      retries: 60

  smoke-test:
    image: docker.io/curlimages/curl:latest
    pull_policy: always
    profiles:
      - test
    environment:
      KUBLING_BASE_URL: http://kubling:8282
      KUBLING_VDB: RedfishSampleVDB
    depends_on:
      stack-readiness:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/smoke-test.sh"]
    volumes:
      - ./scripts/smoke-test.sh:/scripts/smoke-test.sh:ro

volumes:
  descriptor-bundle:
