                definition: ComputerSystem
            - kind: collection
              pointer: /Storage/@odata.id
              resource:
                schema: Storage.v1_23_0.json
                definition: Storage
          branches:
            - name: storage_drives_inventory
              steps:
                - kind: linked
                  pointer: /Drives
                  resource:
                    schema: Drive.v1_22_0.json
                    definition: Drive
        - mode: union
          prefix:
            - kind: collection
              pointer: /Chassis/@odata.id
              resource:
                schema: Chassis.v1_29_0.json
                definition: Chassis
          branches:
            - name: chassis_drives_inventory
              steps:
                - kind: collection
                  pointer: /Drives/@odata.id
                  resource:
                    schema: Drive.v1_22_0.json
                    definition: Drive
    stableKey: [namespace, device_id, resource_uri]
    routing: [namespace, device_id]
    columns:
