      - name: model
        source: payload
        pointer: /Model
      - name: socket
        source: payload
        pointer: /Socket
      - name: total_cores
        source: payload
        pointer: /TotalCores
      - name: total_threads
        source: payload
        pointer: /TotalThreads
      - name: max_speed_mhz
        source: payload
        pointer: /MaxSpeedMHz
      - name: operating_speed_mhz
        source: payload
        pointer: /OperatingSpeedMHz
      - name: firmware_version
        source: payload
        pointer: /FirmwareVersion

  - name: MEMORY_MODULES
