      - name: status_health
        source: payload
        pointer: /Status/Health
      - name: status_health_rollup
        source: payload
        pointer: /Status/HealthRollup
      - name: memory_device_type
        source: payload
        pointer: /MemoryDeviceType
      - name: base_module_type
        source: payload
        pointer: /BaseModuleType
      - name: manufacturer
        source: payload
        pointer: /Manufacturer
      - name: model
        source: payload
        pointer: /Model
      - name: serial_number
        source: payload
        pointer: /SerialNumber
      - name: part_number
        source: payload
        pointer: /PartNumber
      - name: device_locator
        source: payload
        pointer: /DeviceLocator
      - name: capacity_mib
        source: payload
        pointer: /CapacityMiB
      - name: operating_speed_mhz
