  - name: STORAGE_CONTROLLERS
    annotation: Modern and legacy storage controllers normalized per storage subsystem
    resource:
      schema: StorageController.v1_12_0.json
      definition: StorageController
    discovery:
      kind: graph
      routes:
        - mode: fallback
          prefix:
            - kind: collection
              pointer: /Systems/@odata.id
              resource:
                schema: ComputerSystem.v1_29_0.json
                definition: ComputerSystem
              capture: system_uri
            - kind: collection
              pointer: /Storage/@odata.id
              resource:
                schema: Storage.v1_23_0.json
                definition: Storage
              capture: storage_uri
          branches:
            - name: modern_storage_controllers
              variant: modern
              steps:
                - kind: collection
                  pointer: /Controllers/@odata.id
                  resource:
                    schema: StorageController.v1_12_0.json
                    definition: StorageController
            - name: legacy_storage_controllers
              variant: legacy
              steps:
                - kind: embedded
                  pointer: /StorageControllers
                  resource:
                    schema: Storage.v1_23_0.json
                    definition: StorageController
              mappings:
                redfish_id:
                  pointer: /MemberId
                odata_type:
                  omit: true
    stableKey: [namespace, device_id, resource_uri]
    routing: [namespace, device_id]
    columns:
      - name: namespace
        source: namespace
        annotation: Operator-defined logical device grouping
      - name: device_id
        source: device_id
        annotation: Operator-defined stable Redfish endpoint identity
      - name: resource_uri
        source: resource_uri
        pointer: /@odata.id
        annotation: Canonical Redfish storage controller URI
      - name: system_uri
        source: context
        context: system_uri
        annotation: Canonical URI of the containing computer system
      - name: storage_uri
        source: context
        context: storage_uri
        annotation: Canonical URI of the containing storage subsystem
      - name: model_source
        source: variant
        annotation: Redfish model generation used for this row
      - name: redfish_id
        source: payload
        pointer: /Id
        annotation: Redfish resource or embedded member identifier
      - name: name
        source: payload
        pointer: /Name
      - name: odata_type
        source: payload
        pointer: /@odata.type
        annotation: Redfish OData type when supplied by the model
      - name: observed_at
        source: observed_at
        annotation: Time at which the storage controller was observed
      - name: status_state
        source: payload
        pointer: /Status/State
      - name: status_health
        source: payload
        pointer: /Status/Health
      - name: status_health_rollup
        source: payload
        pointer: /Status/HealthRollup
      - name: manufacturer
        source: payload
        pointer: /Manufacturer
      - name: model
        source: payload
        pointer: /Model
      - name: serial_number
        source: payload
        pointer: /SerialNumber
      - name: part_number
        source: payload
        pointer: /PartNumber
      - name: firmware_version
        source: payload
        pointer: /FirmwareVersion
      - name: speed_gbps
        source: payload
        pointer: /SpeedGbps
      - name: supported_controller_protocols
        source: payload
        pointer: /SupportedControllerProtocols
      - name: supported_device_protocols
        source: payload
        pointer: /SupportedDeviceProtocols
      - name: supported_raid_types
        source: payload
