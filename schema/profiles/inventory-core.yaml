formatVersion: 2
name: inventory-core
namespace: redfish

serviceRoot:
  schema: ServiceRoot.v1_22_0.json
  definition: ServiceRoot

tables:
  - name: NAMESPACES
    annotation: Configured Redfish namespaces and their device cardinality
    discovery:
      kind: registry
    stableKey: [namespace]
    routing: []
    columns:
      - name: namespace
        source: namespace
        annotation: Operator-defined logical device grouping
      - name: device_count
        source: device_count
        annotation: Number of configured Redfish devices in the namespace

  - name: DEVICES
    annotation: Configured Redfish services and their observed service identity
    resource:
      schema: ServiceRoot.v1_22_0.json
      definition: ServiceRoot
    discovery:
      kind: singleton
      uri: /redfish/v1/
    stableKey: [namespace, device_id, resource_uri]
    routing: [namespace, device_id]
    columns:
      - name: namespace
        source: namespace
        annotation: Operator-defined logical device grouping
      - name: device_id
        source: device_id
        annotation: Operator-defined stable Redfish endpoint identity
      - name: resource_uri
        source: resource_uri
        pointer: /@odata.id
        annotation: Canonical Redfish resource URI
      - name: redfish_id
        source: payload
        pointer: /Id
      - name: name
        source: payload
        pointer: /Name
      - name: odata_type
        source: payload
        pointer: /@odata.type
      - name: observed_at
        source: observed_at
        annotation: Time at which the service root was observed
      - name: service_uuid
        source: payload
        pointer: /UUID
      - name: vendor
        source: payload
        pointer: /Vendor
      - name: product
        source: payload
        pointer: /Product
      - name: redfish_version
        source: payload
        pointer: /RedfishVersion

  - name: SYSTEMS
    annotation: Redfish ComputerSystem inventory and current state
    resource:
      schema: ComputerSystem.v1_29_0.json
      definition: ComputerSystem
    discovery:
      kind: collection
      pointer: /Systems/@odata.id
    stableKey: [namespace, device_id, resource_uri]
    routing: [namespace, device_id]
    columns:
      - name: namespace
        source: namespace
        annotation: Operator-defined logical device grouping
      - name: device_id
        source: device_id
        annotation: Operator-defined stable Redfish endpoint identity
      - name: resource_uri
        source: resource_uri
        pointer: /@odata.id
        annotation: Canonical Redfish resource URI
      - name: redfish_id
        source: payload
        pointer: /Id
      - name: name
        source: payload
        pointer: /Name
      - name: odata_type
        source: payload
        pointer: /@odata.type
      - name: observed_at
        source: observed_at
        annotation: Time at which the resource was observed
      - name: status_state
        source: payload
        pointer: /Status/State
      - name: status_health
        source: payload
        pointer: /Status/Health
      - name: status_health_rollup
        source: payload
        pointer: /Status/HealthRollup
      - name: system_type
        source: payload
        pointer: /SystemType
      - name: manufacturer
        source: payload
        pointer: /Manufacturer
      - name: model
        source: payload
        pointer: /Model
      - name: sku
        source: payload
        pointer: /SKU
      - name: serial_number
        source: payload
        pointer: /SerialNumber
      - name: part_number
        source: payload
        pointer: /PartNumber
      - name: uuid
        source: payload
        pointer: /UUID
      - name: bios_version
        source: payload
        pointer: /BiosVersion
      - name: host_name
        source: payload
        pointer: /HostName
      - name: power_state
        source: payload
        pointer: /PowerState

  - name: PROCESSORS
    annotation: Processors discovered below Redfish computer systems
    resource:
      schema: Processor.v1_24_0.json
      definition: Processor
    discovery:
      kind: graph
      routes:
        - mode: union
          prefix:
            - kind: collection
              pointer: /Systems/@odata.id
              resource:
                schema: ComputerSystem.v1_29_0.json
                definition: ComputerSystem
              capture: system_uri
          branches:
            - name: system_processors
              steps:
                - kind: collection
                  pointer: /Processors/@odata.id
                  resource:
                    schema: Processor.v1_24_0.json
                    definition: Processor
