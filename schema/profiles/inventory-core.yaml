    routing: [namespace, device_id]
    columns:
      - name: namespace
        source: namespace
        annotation: Operator-defined logical device grouping
      - name: device_id
        source: device_id
        annotation: Operator-defined stable Redfish endpoint identity
      - name: resource_uri
        source: resource_uri
        pointer: /@odata.id
        annotation: Canonical Redfish processor URI
      - name: system_uri
        source: context
        context: system_uri
        annotation: Canonical URI of the containing computer system
      - name: redfish_id
        source: payload
        pointer: /Id
      - name: name
        source: payload
        pointer: /Name
      - name: odata_type
        source: payload
        pointer: /@odata.type
      - name: observed_at
        source: observed_at
        annotation: Time at which the processor was observed
      - name: status_state
        source: payload
        pointer: /Status/State
      - name: status_health
        source: payload
        pointer: /Status/Health
      - name: status_health_rollup
        source: payload
        pointer: /Status/HealthRollup
