      - name: redfish_id
        source: payload
        pointer: /Id
      - name: name
        source: payload
        pointer: /Name
      - name: odata_type
        source: payload
        pointer: /@odata.type
      - name: observed_at
        source: observed_at
        annotation: Time at which the memory module was observed
      - name: status_state
        source: payload
